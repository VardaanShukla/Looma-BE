[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "looma"
version = "0.1.0"
description = "Shows what changed in your code, readable by people who don't read diffs"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Vardaan Shukla" }]
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
looma = "looma.cli:main"
# The command's old name, kept so scripts and habits from before the rename still work.
devdash = "looma.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
looma = ["store/*.sql", "web/*", "web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
